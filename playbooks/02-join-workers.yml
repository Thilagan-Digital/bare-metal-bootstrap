---
- name: Join Worker Nodes to Cluster
  hosts: worker_nodes
  become: true
  vars:
    control_ip: "{{ hostvars[groups['control_node'][0]]['ansible_default_ipv4']['address'] }}"
  tasks:
    - name: Check cluster membership
      command: pvecm status
      register: member_status
      failed_when: false
      changed_when: false

    - name: Join cluster via SSH authentication
      # `ansible.builtin.expect` runs on the MANAGED node, so `pexpect` must be
      # installed on each worker (not the control machine): apt install
      # python3-pexpect / pip install pexpect. It drives pvecm's interactive
      # password + host-key prompts. `--use_ssh` also needs this worker's root
      # able to SSH to the control node (key or password).
      expect:
        command: "pvecm add {{ control_ip }} --link0 {{ ansible_default_ipv4.address }} --use_ssh"
        responses:
          (?i)password: "{{ pve_root_password }}"
          (?i)are you sure you want to continue connecting: "yes"
      # `responses` carries the root password and is not a no_log parameter of
      # the expect module, so without this it lands in the node's syslog and in
      # -v / failure output. Drop it temporarily to debug a failing join.
      no_log: true
      when: member_status.rc != 0

# Root-to-root SSH host-key trust between every cluster member.
#
# `pvecm add` puts each node's key in the cluster-wide
# /etc/pve/nodes/<node>/ssh_known_hosts, which pvecm and `qm migrate` use, but
# NOT in root's ~/.ssh/known_hosts. So plain `ssh root@<peer>` from one node to
# another fails "Host key verification failed." for any member that joined
# after the others last traded keys by hand. Anything that SSHes between nodes
# by name in BatchMode (health checks, ad-hoc migrations) then breaks for the
# late joiner, in both directions (system-docs-hub#1241, prox40 2026-11-19).
#
# Trust model: each node's key is read from its own /etc/ssh over the Ansible
# connection, not ssh-keyscan'd. That is only as strong as the controller's
# check of that connection, and this repo's ansible.cfg sets
# host_key_checking = False, so it is trust-on-first-use, the same as the
# "yes" this file already answers to pvecm's host-key prompt above.
#
# ADD-ONLY: an alias that already has an entry is left alone, even if the key
# differs. That fixes a late joiner without ever re-trusting a regenerated key
# on an existing member, and it never overwrites keys a private inventory pins
# on purpose (homelab-infra roles/pve_peer_known_hosts). A key that really
# changed must be replaced deliberately (ssh-keygen -R, or the pin).
- name: Trust every cluster member's SSH host key on every other member
  hosts: control_node:worker_nodes
  become: true
  tasks:
    # With --limit <new node> the play sees no peers and would report ok
    # while doing nothing; the joiner and the existing members must run
    # together (e.g. --limit control_node:worker_nodes).
    - name: Refuse a limited run that leaves this node no peers
      ansible.builtin.assert:
        that: ansible_play_hosts | length > 1
        fail_msg: >-
          Only {{ inventory_hostname }} is in this run, so no host keys can be
          traded. Re-run with the existing members included, e.g.
          --limit control_node:worker_nodes.
        quiet: true
      when: ansible_limit is defined

    - name: Read this node's ed25519 host public key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: own_host_key

    - name: Build the peer alias list (inventory name, then ansible_host)
      ansible.builtin.set_fact:
        peer_key_aliases: >-
          {%- set out = [] -%}
          {%- for peer in ansible_play_hosts if peer != inventory_hostname -%}
          {%- for alias in [peer, hostvars[peer].ansible_host | default(peer)] | unique -%}
          {%- set _ = out.append([peer, alias]) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    - name: Find which aliases root already has a key for
      ansible.builtin.command:
        argv: [ssh-keygen, -F, "{{ item.1 }}", -f, /root/.ssh/known_hosts]
      register: existing_peer_keys
      changed_when: false
      failed_when: false
      loop: "{{ peer_key_aliases }}"
      loop_control:
        label: "{{ item.1 }}"

    - name: Add each peer's host key where no entry exists yet
      ansible.builtin.known_hosts:
        name: "{{ item.item.1 }}"
        key: "{{ item.item.1 }} {{ (hostvars[item.item.0].own_host_key.content | b64decode).split()[:2] | join(' ') }}"
        path: /root/.ssh/known_hosts
        state: present
      when: item.rc != 0
      loop: "{{ existing_peer_keys.results }}"
      loop_control:
        label: "{{ item.item.1 }}"
