name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Was @master (a branch, the most volatile ref possible) — repinned to the
      # latest tagged release per ADR-2026-PLATFORM-OPS-01. `severity`/`scandir`
      # inputs are unchanged at 2.0.0 (verified against action.yaml at this SHA).
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: "."

      - name: Bash syntax check
        run: |
          set -euo pipefail
          for f in *.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

  ansible-lint:
    name: Ansible syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Playbook syntax check
        run: ansible-playbook --syntax-check -i inventory.example/hosts.ini site.yml

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for leaked secrets
        run: gitleaks detect --source . --verbose
