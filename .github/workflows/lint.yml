name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Was @master (a branch, the most volatile ref possible) — repinned to the
      # latest tagged release per ADR-2026-PLATFORM-OPS-01. `severity`/`scandir`
      # inputs are unchanged at 2.0.0 (verified against action.yaml at this SHA).
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: "."

      - name: Bash syntax check
        run: |
          set -euo pipefail
          for f in *.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

  ansible-lint:
    name: Ansible syntax check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Playbook syntax check
        run: ansible-playbook --syntax-check -i inventory.example/hosts.ini site.yml

  secrets:
    name: secrets
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Verify before extracting (new-leaf-platform#320). Piping a release
      # tarball straight into tar runs whatever arrives on the runner; pinning
      # the version alone doesn't help if the artefact behind the tag changes.
      # Checksum from gitleaks_8.30.1_checksums.txt. When bumping
      # GITLEAKS_VERSION, update GITLEAKS_SHA256 in the same change.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" -C /usr/local/bin gitleaks
          rm -f "$TARBALL"

      - name: Scan for leaked secrets
        run: gitleaks detect --source . --verbose
