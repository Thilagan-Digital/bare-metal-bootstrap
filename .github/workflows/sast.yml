name: SAST (Semgrep)

# Self-contained Semgrep OSS scan — part of the org-wide SAST rollout tracked in
# Thilagan-Digital/system-docs-hub#104.
#
# Deliberately NOT calling the shared security-gate.yml reusable workflow here:
# it lives in the private system-docs-hub repo and hardcodes self-hosted runners
# for its jobs. This repo is public, so running a self-hosted-runner job on
# `pull_request` from an external fork is exactly the arbitrary-code-execution
# risk GitHub warns against for public repos, and a public caller invoking a
# private repo's reusable workflow is unsupported besides. lint.yml already
# sidesteps the runner issue by using ubuntu-latest for PR checks; this workflow
# follows the same pattern rather than inheriting the reusable's self-hosted
# requirement. ubuntu-latest is free here precisely because the repo is public,
# so this does not draw on the org's (zero) GitHub-hosted Actions budget.
#
# continue-on-error stayed true until a first-run false-positive baseline was
# triaged, per #104's rollout guidance — not a required check on day one.
# Triage is now done (Thilagan-Digital/system-docs-hub#377 § 2): the live
# finding count is 0 as of this change, so `semgrep scan --error` below is now
# a hard gate. This workflow does not call the reusable security-gate.yml (see
# below), so it has no `baseline-clean` input to flip — `continue-on-error` on
# the scan step is this repo's own equivalent lever, and this is that flip.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `actions: read` is required by github/codeql-action/upload-sarif below: before
# uploading it calls GET /repos/{owner}/{repo}/actions/runs/{run_id} to resolve
# the analysis context (workflow path + ref). Repo visibility does not help here
# — once a `permissions:` block is declared, every scope it omits is `none`, so
# without this line the upload 403s with "Resource not accessible by
# integration" (Thilagan-Digital/system-docs-hub#377 § 3).
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Not returntocorp/semgrep-action@v1, which this job used until #377: it
      # runs `semgrep ci` and only ever printed findings to the Actions log —
      # it emits no SARIF, so this repo had no upload step at all and its
      # Security tab has always been empty. It is deprecated upstream besides.
      # The native pip install mirrors what security-gate.yml does for the
      # private repos, which keeps the two scan paths comparable when triaging.
      - name: Install Semgrep
        run: pip3 install --no-cache-dir --break-system-packages semgrep

      # --sarif-output (not --sarif --output=) writes a SARIF copy for the
      # upload step below while leaving the human-readable finding list on
      # stdout — `--sarif --output=` alone suppresses it entirely, which makes
      # triaging a first run from the Actions log impossible.
      - name: Run Semgrep OSS
        run: semgrep scan --config=auto --sarif-output=semgrep.sarif --error

      # This repo is public, so code scanning ingestion is available without
      # GitHub Code Security — unlike the six private repos, where the same
      # upload is refused with "Code Security must be enabled for this
      # repository to use code scanning" (system-docs-hub#377 § 3). That makes
      # this the one repo in the org whose Security tab can actually serve as
      # the finding source for false-positive triage today.
      #
      # if: always() so a scan that exits non-zero on findings still uploads
      # them.
      #
      # Pinned to the commit SHA that v4.37.3 points at — the same version the
      # reusable pins by tag (system-docs-hub#379), just at SHA granularity.
      # Not a pre-emption of the org-wide SHA-pinning decision (#377 § 1),
      # which stays open: this line is pinned because the upload it enables
      # immediately flagged it as `github-actions-mutable-action-tag`, and
      # resolving a finding on a line this very workflow introduced beats
      # dismissing it. Whichever way § 1 lands, a SHA is not the wrong
      # direction, and this file gets normalised with the rest either way.
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: semgrep.sarif
